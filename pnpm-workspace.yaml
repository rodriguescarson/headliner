# pnpm 12 reads build-script approvals here, not from package.json.
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: false

# Patched transitive dependencies of @modelcontextprotocol/sdk (pnpm audit, 2026-10-24).
overrides:
  body-parser@2: ^2.4.0
  fast-uri@3: ^3.1.9
  hono@4: 4.13.16
  '@hono/node-server@2': 2.1.6
  minimatch@10: 11.0.1
  systeminformation@5: 5.33.16

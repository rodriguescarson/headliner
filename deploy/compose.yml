# Headliner on Carson's VPS, behind the shared supabase-caddy that already owns 80/443.
# The app joins the headliner Supabase stack's network so Caddy can reach it by name.
#   cd /opt/headliner && docker compose -f deploy/compose.yml up -d --build
services:
  app:
    build:
      context: ..
    container_name: headliner-app
    restart: unless-stopped
    env_file: ../.env
    environment:
      HEADLINER_CACHE_DIR: /data/qloo
    volumes:
      - qloo-cache:/data/qloo
    expose:
      - "3000"
    networks:
      - stack
volumes:
  qloo-cache:
networks:
  stack:
    name: headliner_default
    external: true

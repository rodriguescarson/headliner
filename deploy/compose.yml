# Headliner on Carson's VPS, behind the shared supabase-caddy that already owns 80/443.
# The app joins the headliner Supabase stack's network so Caddy can reach it by name.
# The image is built off-box by deploy/deploy.sh; this file never builds.
services:
  app:
    image: ${HEADLINER_IMAGE:-headliner-app:latest}
    container_name: headliner-app
    restart: unless-stopped
    env_file: ../.env
    environment:
      HEADLINER_CACHE_DIR: /data/qloo
    volumes:
      - qloo-cache:/data/qloo
    expose:
      - "3000"
    networks:
      - stack
    # A hard ceiling so a runaway request can never starve the other stacks on this box.
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  qloo-cache:
networks:
  stack:
    name: headliner_default
    external: true
